name: Deploy website

on:
  pull_request:
    paths:
      - "Website/**"
      - "Tools/validate_website.py"
      - ".github/workflows/pages.yml"
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "Tools/validate_website.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA approved by Nell for website deployment
        required: true
        type: string
      approval:
        description: Enter DEPLOY_WEBSITE followed by a colon and the exact candidate SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate static website
        run: python3 Tools/validate_website.py

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Verify exact-candidate approval input
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          [[ "$CANDIDATE_SHA" == "$GITHUB_SHA" ]] || {
            echo "candidate_sha does not match the dispatched commit" >&2
            exit 1
          }
          [[ "$APPROVAL" == "DEPLOY_WEBSITE:$GITHUB_SHA" ]] || {
            echo "approval does not match the dispatched commit" >&2
            exit 1
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Confirm checked-out candidate
        run: test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: Website
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
