name: Validate

on:
  pull_request:
  push:
    branches: [master, main, "revival/**"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install audio validation tools
        run: brew install ffmpeg
      - name: Validate project and plists
        run: |
          plutil -lint "Beddy Butler.xcodeproj/project.pbxproj"
          plutil -lint "Beddy Butler/Info.plist"
          plutil -lint "Beddy Butler/Beddy Butler.entitlements"
          plutil -lint "Beddy Butler/PrivacyInfo.xcprivacy"
      - name: Validate formatting and static assets
        run: |
          xcrun swift-format lint --recursive "Beddy Butler" "Beddy ButlerTests" Tools
          python3 Tools/validate_website.py
          python3 Tools/prepare_audio.py --check
      - name: Test
        run: |
          xcodebuild test \
            -project "Beddy Butler.xcodeproj" \
            -scheme "Beddy Butler" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BeddyButlerTests" \
            CODE_SIGNING_ALLOWED=NO
      - name: Analyze
        run: |
          xcodebuild analyze \
            -project "Beddy Butler.xcodeproj" \
            -scheme "Beddy Butler" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BeddyButlerAnalyze" \
            CODE_SIGNING_ALLOWED=NO
      - name: Release build
        run: |
          xcodebuild build \
            -project "Beddy Butler.xcodeproj" \
            -scheme "Beddy Butler" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/BeddyButlerRelease" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
