name: Validate

on:
  pull_request:
  push:
    branches: [master, main, "revival/**"]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install audio validation tools
        run: brew install ffmpeg
      - name: Validate project and plists
        run: |
          set -euo pipefail
          plutil -lint "Beddy Butler.xcodeproj/project.pbxproj"
          plutil -lint "Beddy Butler/Info.plist"
          plutil -lint "Beddy Butler/Beddy Butler.entitlements"
          plutil -lint "Beddy Butler/PrivacyInfo.xcprivacy"
      - name: Validate formatting and static assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/BeddyButlerEvidence"
          {
            xcrun swift-format lint --strict --recursive "Beddy Butler" "Beddy ButlerTests" Tools
            python3 Tools/validate_ci_workflow.py
            python3 Tools/validate_website.py
            python3 Tools/test_website_samples.py
            node Tools/test_website_samples.js
            node Tools/test_website_avatars.cjs
            python3 Tools/validate_app_store_metadata.py
            python3 Tools/check_large_files.py
            python3 Tools/test_app_bundle_validation.py
            python3 Tools/test_release_evidence.py
            python3 Tools/test_publication_approval.py
            python3 Tools/validate_publication_controls.py
            python3 Tools/test_security_posture.py
            python3 Tools/test_live_destinations.py
            python3 Tools/prepare_audio.py --check
          } 2>&1 | tee "$RUNNER_TEMP/BeddyButlerEvidence/static-validation.txt"
      - name: Test
        run: |
          set -euo pipefail
          xcodebuild test \
            -project "Beddy Butler.xcodeproj" \
            -scheme "Beddy Butler" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BeddyButlerTests" \
            -resultBundlePath "$RUNNER_TEMP/BeddyButlerTests.xcresult" \
            -jobs 2 \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_STAT_CACHE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/BeddyButlerEvidence/xctest.txt"
      - name: Release build with warnings as errors
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "Beddy Butler.xcodeproj" \
            -scheme "Beddy Butler" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/BeddyButlerRelease" \
            -jobs 2 \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CLANG_STAT_CACHE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee "$RUNNER_TEMP/BeddyButlerEvidence/release-build.txt"
          python3 Tools/validate_app_bundle.py \
            "$RUNNER_TEMP/BeddyButlerRelease/Build/Products/Release/Beddy Butler.app" \
            --version 2.0.3 \
            --build 614 \
            --require-universal \
            2>&1 | tee "$RUNNER_TEMP/BeddyButlerEvidence/bundle-validation.txt"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beddy-butler-validation-evidence
          path: |
            ${{ runner.temp }}/BeddyButlerEvidence
            ${{ runner.temp }}/BeddyButlerTests.xcresult
          if-no-files-found: ignore
          retention-days: 14
